name: lint

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  run-linters:
    name: run-linters
    runs-on: ubuntu-latest

    steps:
      # checkout the repo
      - uses: actions/checkout@v7

      # protobuf lint
      - name: protobuf-lint
        uses: bufbuild/buf-action@v1
        with:
          breaking: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # golang lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ./backend
