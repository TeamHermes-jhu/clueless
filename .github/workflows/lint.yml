name: lint

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: write

jobs:
  run-linters:
    name: run-linters
    runs-on: ubuntu-latest

    steps:
      # checkout the repo
      - uses: actions/checkout@v7

      # protobuf lint
      - uses: bufbuild/buf-setup-action@v1
      - name: protobuf-lint
        uses: bufbuild/buf-lint-action@v1

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # golang lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: ./backend
