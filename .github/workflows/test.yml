name: test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  run-testers:
    name: run-testers
    runs-on: ubuntu-latest

    steps:
      # checkout the repo
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - uses: bufbuild/buf-setup-action@v1

      # generate code from protos so backend code that imports it builds
      - name: buf generate
        run: buf generate

      # go test
      - name: Install dependencies
        run: |
          cd backend/
          go get .
      - name: Build
        run: |
          cd backend/
          go build -v ./...
      - name: Test
        run: |
          cd backend/
          go test ./...

