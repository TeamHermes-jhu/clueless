version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/TeamHermes-jhu/clueless/backend/internal/gen/
plugins:
  - remote: buf.build/protocolbuffers/go
    out: backend/internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: backend/internal/gen
    opt: paths=source_relative
  - local:
      [
        "node",
        "frontend/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es",
      ]
    out: frontend/src/app/common/events/event-types/gen
    opt: target=ts
