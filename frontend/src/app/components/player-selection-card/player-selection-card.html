<div
  class="card"
  role="button"
  [class.unavailable]="!selectable()"
  [attr.tabindex]="selectable() ? 0 : -1"
  [attr.aria-disabled]="!selectable()"
  [attr.aria-label]="selectable() ? name() : name() + ' (unavailable)'"
  [attr.title]="selectable() ? null : 'Already taken'"
  (click)="confirmSelection()"
  (keydown.enter)="confirmSelection()"
>
  <img [src]="image()" [alt]="name()" draggable="false" />
</div>

<p-confirmdialog />
