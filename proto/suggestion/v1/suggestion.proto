// Message definitions relating to suggestions and accusations in the game

edition = "2024";

package suggestion.v1;

import "cards/v1/cards.proto";

// Message representing a suggestion made by a player in the game
message SuggestionRequest {
  int32 suggestion_id = 1; // Unique identifier for the suggestion
  string player_id = 2; // ID of the player making the suggestion

  cards.v1.Characters character = 3; // Character being suggested
  cards.v1.Weapons weapon = 4; // Weapon being suggested
  cards.v1.Rooms room = 5; // Room being suggested
}

// Message representing an accusation made by a player in the game
message AccusationRequest {
  int32 accusation_id = 1; // Unique identifier for the accusation
  SuggestionRequest suggestion = 2; // The suggestion being accused
}

// Message representing the response to a suggestion
message SuggestionResponse {
  int32 suggestion_id = 1; // Unique identifier for the suggestion being responded to
  int32 responder_id = 2; // ID of the player responding to the suggestion
  bool has_card = 3; // True if the responder has a card to show, false otherwise

  oneof card { // The card shown in response to the suggestion, if any
    cards.v1.Characters character = 4; // Character card shown in response
    cards.v1.Weapons weapon = 5; // Weapon card shown in response
    cards.v1.Rooms room = 6; // Room card shown in response
  }
}

// Message representing the response to an accusation
message AccusationResponse {
  int32 accusation_id = 1; // Unique identifier for the accusation being responded to
  bool is_correct = 2; // True if the accusation is correct, false otherwise
}
