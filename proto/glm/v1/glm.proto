// Message definitions related to the game logic manager (GLM) for the Clueless
// game.
edition = "2024";

package glm.v1;

import "cards/v1/cards.proto";

message PlayerGameState {
  PlayerLocation location = 1;
  PlayerHand hand = 2;
  cards.v1.Characters character = 3; // Character the player controls on the board
}

message PlayerLocation {
  oneof location {
    cards.v1.Rooms room = 1;
    cards.v1.Halls hall = 2;
  }
}

message CaseFile {
  cards.v1.Characters character = 1;
  cards.v1.Weapons weapon = 2;
  cards.v1.Rooms room = 3;
}

message PlayerHand {
  repeated cards.v1.Characters characters = 1;
  repeated cards.v1.Weapons weapons = 2;
  repeated cards.v1.Rooms rooms = 3;
}

message CharacterChoices {
  repeated cards.v1.Characters characters = 1;
}

message CharacterSelectRequest {
  string player_id = 1;
  cards.v1.Characters character = 2;
}

message CharacterSelectResponse {
  string player_id = 1;
  bool ok = 2;
}
