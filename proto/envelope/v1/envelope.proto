edition = "2024";

package envelope.v1;

import "session/v1/session.proto";
import "suggestion/v1/suggestion.proto";

message Envelope {
  oneof payload {
    session.v1.Move move = 1;
    session.v1.Message msg = 2;
    suggestion.v1.SuggestionRequest suggest = 3;
    suggestion.v1.AccusationRequest accuse = 4;
    session.v1.Error error = 5;
  }
}
